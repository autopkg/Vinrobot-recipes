repos:
  - repo: https://github.com/homebysix/pre-commit-macadmin
    rev: f185830bd74d90dab3d6d82dad5acb86b9e5329f  # frozen: v1.25.1
    hooks:
      - id: check-autopkg-recipes
        args: ["--recipe-prefix=com.github.vinrobot.", "--strict", "--"]
      - id: forbid-autopkg-overrides
      - id: forbid-autopkg-trust-info
      - id: format-xml-plist
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=100"]
      - id: check-ast
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: no-commit-to-branch
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: a5439e9af2ff9371297bb1a76a01b8ad17989b88  # frozen: 26.10.1
    hooks:
      - id: black
  - repo: https://github.com/pycqa/isort
    rev: 5d9c96196def28a1819b6a755a669ec0a3add6aa  # frozen: 10.0.0b2
    hooks:
      - id: isort
  - repo: https://github.com/pycqa/flake8
    rev: 960c1d286190804104f7255b97da034446fdaac3  # frozen: 7.5.0
    hooks:
      - id: flake8
  - repo: https://github.com/asottile/blacken-docs
    rev: dda8db18cfc68df532abf33b185ecd12d5b7b326  # frozen: 1.20.0
    hooks:
      - id: blacken-docs
        additional_dependencies: [black==24.10.0]
  - repo: https://github.com/pycqa/pylint
    rev: 233ae8862a1a94c1797ec664813e1aeef3142622  # frozen: v4.1.3
    hooks:
      - id: pylint
